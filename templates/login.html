<!DOCTYPE html>
<html lang="{{ lang }}" dir="{{ dir }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول — منظومة كيرو السحابية لإدارة المطابع</title>

    <!-- Tailwind CSS + Font Awesome -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- خط تجوال الحديث -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">

    <style>
        * {
            font-family: 'Tajawal', 'Segoe UI', sans-serif;
            box-sizing: border-box;
        }

        :root {
            --royal-red-dark: #220307;
            --royal-red: #5c0a17;
            --royal-red-accent: #8b1024;
            --cream-light: #faf5ef;
            --cream-base: #f0e4d4;
            --cream-gold: #dfc8b0;
            --glass-bg: rgba(45, 6, 12, 0.5);
            --glass-border: rgba(223, 200, 176, 0.22);
            --glass-input: rgba(25, 3, 6, 0.65);
        }

        body {
            background-color: var(--royal-red-dark);
            background-image:
                radial-gradient(circle at 15% 20%, rgba(139, 16, 36, 0.35) 0%, transparent 45%),
                radial-gradient(circle at 85% 80%, rgba(223, 200, 176, 0.12) 0%, transparent 50%),
                linear-gradient(145deg, #180205 0%, #2f050b 50%, #150104 100%);
            min-height: 100vh;
            color: var(--cream-light);
            overflow-x: hidden;
        }

        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--glass-border);
            box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.7),
                        inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        .glass-input {
            background: var(--glass-input);
            border: 1px solid rgba(223, 200, 176, 0.2);
            color: var(--cream-light);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass-input:focus {
            outline: none;
            border-color: var(--cream-gold);
            background: rgba(20, 2, 5, 0.85);
            box-shadow: 0 0 15px rgba(223, 200, 176, 0.25);
        }

        .btn-royal {
            background: linear-gradient(135deg, #8b1024 0%, #5c0a17 100%);
            border: 1px solid rgba(223, 200, 176, 0.3);
            color: var(--cream-light);
            box-shadow: 0 10px 25px -5px rgba(92, 10, 23, 0.5);
            transition: all 0.3s ease;
        }

        .btn-royal:hover {
            background: linear-gradient(135deg, #a3142c 0%, #6e0d1d 100%);
            border-color: var(--cream-gold);
            transform: translateY(-2px);
            box-shadow: 0 14px 28px -5px rgba(139, 16, 36, 0.6);
        }

        .tab-btn-active {
            background: linear-gradient(135deg, #8b1024, #5c0a17);
            color: var(--cream-light);
            border: 1px solid rgba(223, 200, 176, 0.35);
        }

        .ambient-glow-1 {
            animation: floatGlow 14s infinite alternate ease-in-out;
        }
        .ambient-glow-2 {
            animation: floatGlow 10s infinite alternate-reverse ease-in-out;
        }

        @keyframes floatGlow {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(30px, -25px) scale(1.08); }
            100% { transform: translate(-20px, 20px) scale(0.95); }
        }
    </style>
    {{ ui_head() }}
</head>

<body class="flex items-center justify-center p-4 relative min-h-screen">

    <!-- الإضاءات التفاعلية الخلفية -->
    <div class="fixed inset-0 pointer-events-none overflow-hidden z-0">
        <div class="absolute top-[10%] right-[15%] w-[420px] h-[420px] bg-red-900/25 rounded-full blur-[140px] ambient-glow-1"></div>
        <div class="absolute bottom-[10%] left-[15%] w-[460px] h-[460px] bg-[#dfc8b0]/10 rounded-full blur-[160px] ambient-glow-2"></div>
    </div>

    <div class="fixed top-4 left-4 z-20 flex gap-1.5 text-[11px] font-bold" dir="ltr">
        {% for code, info in langs.items() %}<a href="/lang/{{ code }}" class="px-3 py-1.5 rounded-full border border-[#dfc8b0]/30 {{ 'bg-[#8b1024] text-white' if code == lang else 'text-[#dfc8b0] hover:bg-white/10' }}">{{ info.name }}</a>{% endfor %}
    </div>

    <!-- كارت الدخول الزجاجي -->
    <div class="w-full max-w-[440px] glass-card rounded-3xl p-8 sm:p-10 relative z-10 transition-all">

        <!-- اللوجو والهيدر -->
        <div class="text-center mb-6">
            <div class="inline-flex w-20 h-20 rounded-2xl bg-gradient-to-tr from-[#5c0a17] to-[#8b1024] items-center justify-center border border-[#dfc8b0]/30 shadow-xl mb-3 shadow-black/40">
                <i class="fa-solid fa-print text-3xl text-[#f0e4d4]"></i>
            </div>
            <h1 class="text-2xl font-black text-[#faf5ef] tracking-wide">KIRO PRINT OS</h1>
            <p class="text-xs text-[#dfc8b0]/80 mt-1 font-medium">المنظومة السحابية الموحدة لإدارة المطابع ونقاط البيع</p>
            <div class="inline-block mt-2.5 px-3 py-1 rounded-full bg-black/30 border border-[#dfc8b0]/15 text-[11px] text-[#dfc8b0] font-mono" id="egypt-time">
                جاري مزامنة الوقت...
            </div>
        </div>

        <!-- النموذج 1: تسجيل الدخول التقليدي -->
        <form id="form-credentials" action="/auth/login" method="POST" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-[#dfc8b0] mb-2 mr-1">
                    <i class="fa-regular fa-user ml-1"></i> اسم المستخدم
                </label>
                <div class="relative">
                    <input type="text" name="username" required autocomplete="username" dir="ltr"
                           placeholder="أدخل اسم المستخدم"
                           class="w-full glass-input rounded-xl py-3 px-4 text-sm font-semibold placeholder:text-gray-500">
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold text-[#dfc8b0] mb-2 mr-1">
                    <i class="fa-solid fa-lock ml-1"></i> كلمة المرور
                </label>
                <div class="relative">
                    <input type="password" name="password" required autocomplete="current-password" dir="ltr"
                           placeholder="••••••••"
                           class="w-full glass-input rounded-xl py-3 px-4 text-sm tracking-widest placeholder:text-gray-500">
                </div>
            </div>

            <button type="submit" class="btn-royal w-full font-black text-sm py-3.5 rounded-xl flex items-center justify-center gap-2 mt-4 cursor-pointer">
                <span>دخول إلى النظام</span>
                <i class="fa-solid fa-arrow-left text-xs"></i>
            </button>
        </form>

        <!-- الفوتر الداخلي -->
        <div class="text-center mt-8 pt-4 border-t border-[#dfc8b0]/10">
            <p class="text-[10px] text-[#dfc8b0]/60 font-mono tracking-wider">KIRO CLOUD ARCHITECTURE &copy; {{ current_year }}</p>
            <p class="text-[9px] text-gray-500 mt-0.5">منظومة مخصصة لإدارة المطابع وخطوط الإنتاج</p>
        </div>
    </div>

    <script>
        function updateLiveTime() {
            const options = {
                timeZone: 'Africa/Cairo',
                hour12: true,
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                year: 'numeric',
                month: 'numeric',
                day: 'numeric'
            };
            const timeStr = new Date().toLocaleString(document.documentElement.lang === 'en' ? 'en-GB' : 'ar-EG', options);
            const el = document.getElementById('egypt-time');
            if (el) el.innerHTML = '<i class="fa-regular fa-clock ml-1"></i> ' + timeStr;
        }
        setInterval(updateLiveTime, 1000);
        updateLiveTime();

        setTimeout(() => {
            const el = document.getElementById('flash-container');
            if (el) {
                el.style.transition = 'opacity 0.6s ease';
                el.style.opacity = '0';
                setTimeout(() => el.remove(), 600);
            }
        }, 5000);
    </script>
</body>
</html>
